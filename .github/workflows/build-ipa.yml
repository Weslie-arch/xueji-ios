name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['ios-app/**']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Archive (unsigned, generic iOS device)
        working-directory: ios-app
        run: |
          xcodebuild archive \
            -project XueJi.xcodeproj \
            -scheme XueJi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/XueJi.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            > build.log 2>&1 || { tail -60 build.log; exit 1; }
          grep -E "error:|ARCHIVE SUCCEEDED" build.log || true

      - name: Package unsigned IPA
        run: |
          test -d ios-app/build/XueJi.xcarchive/Products/Applications/XueJi.app || { echo "XueJi.app not found"; exit 1; }
          mkdir -p build/Payload
          cp -R ios-app/build/XueJi.xcarchive/Products/Applications/XueJi.app build/Payload/
          cd build
          zip -qry XueJi-unsigned.ipa Payload
          ls -lh XueJi-unsigned.ipa

      - name: Upload artifact (unsigned IPA)
        uses: actions/upload-artifact@v4
        with:
          name: XueJi-unsigned-ipa
          path: build/XueJi-unsigned.ipa
          retention-days: 30
